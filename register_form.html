<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="Create a new account and start exploring." />
  <title>Register — Tuscany Travel</title>
  <link rel="stylesheet" href="style/register.css" />
</head>
<body>

  <div class="register-container">

    <!-- Back to Home -->
    <a href="index.html" class="back-home" title="Back to Home">
      <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="24" height="24" fill="currentColor">
        <path d="M20 11H7.83l5.59-5.59L12 4l-8 8 8 8 1.41-1.41L7.83 13H20v-2z"/>
      </svg>
    </a>

    <!-- Logo / Header -->
    <div class="register-logo">
      <div class="icon-circle">
        <!-- Person-add icon (SVG) -->
        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24">
          <path d="M15 12c2.2 0 4-1.8 4-4s-1.8-4-4-4-4 1.8-4 4 1.8 4 4 4zm-8-2V7H5v3H2v2h3v3h2v-3h3v-2H7zm8 4c-2.7 0-8 1.3-8 4v2h16v-2c0-2.7-5.3-4-8-4z"/>
        </svg>
      </div>
      <h1>Create Account</h1>
      <p>Join us and explore the world</p>
    </div>

    <!-- Register Form -->
    <form id="registerForm" action="#" method="POST" novalidate>

      <!-- First Name + Last Name -->
      <div class="form-row">
        <div class="form-group">
          <label for="firstName">First Name</label>
          <div class="input-wrapper">
            <input
              type="text"
              id="firstName"
              name="firstName"
              placeholder="John"
              autocomplete="given-name"
              required
            />
            <span class="input-icon">&#128100;</span>
          </div>
        </div>

        <div class="form-group">
          <label for="lastName">Last Name</label>
          <div class="input-wrapper">
            <input
              type="text"
              id="lastName"
              name="lastName"
              placeholder="Doe"
              autocomplete="family-name"
              required
            />
            <span class="input-icon">&#128100;</span>
          </div>
        </div>
      </div>

      <!-- Email -->
      <div class="form-group">
        <label for="email">Email Address</label>
        <div class="input-wrapper">
          <input
            type="email"
            id="email"
            name="email"
            placeholder="you@example.com"
            autocomplete="email"
            required
          />
          <span class="input-icon">&#9993;</span>
        </div>
      </div>

      <!-- Phone (optional) -->
      <div class="form-group">
        <label for="phone">Phone Number</label>
        <div class="input-wrapper">
          <input
            type="tel"
            id="phone"
            name="phone"
            placeholder="+1 (555) 000-0000"
            autocomplete="tel"
          />
          <span class="input-icon">&#128222;</span>
        </div>
      </div>

      <!-- Password -->
      <div class="form-group">
        <label for="password">Password</label>
        <div class="input-wrapper">
          <input
            type="password"
            id="password"
            name="password"
            placeholder="Create a strong password"
            autocomplete="new-password"
            required
          />
          <span class="input-icon">&#128274;</span>
        </div>
        <div class="password-strength">
          <div class="strength-bar">
            <span id="bar1"></span>
            <span id="bar2"></span>
            <span id="bar3"></span>
            <span id="bar4"></span>
          </div>
          <span class="strength-label" id="strengthLabel">Password strength</span>
        </div>
      </div>

      <!-- Confirm Password -->
      <div class="form-group">
        <label for="confirmPassword">Confirm Password</label>
        <div class="input-wrapper">
          <input
            type="password"
            id="confirmPassword"
            name="confirmPassword"
            placeholder="Re-enter your password"
            autocomplete="new-password"
            required
          />
          <span class="input-icon">&#128275;</span>
        </div>
      </div>

      <!-- Terms & Conditions -->
      <div class="terms-group">
        <input type="checkbox" id="terms" name="terms" required />
        <span>
          I agree to the
          <a href="#">Terms of Service</a>
          and
          <a href="#">Privacy Policy</a>
        </span>
      </div>

      <!-- Submit -->
      <button type="submit" class="btn-register" id="registerBtn">Create Account</button>

    </form>

    <!-- Divider -->
    <div class="divider">
      <hr />
      <span>Already have an account?</span>
      <hr />
    </div>

    <!-- Login redirect link -->
    <div class="login-redirect">
      <p>Sign in to your account — <a href="login_form.html">Log In</a></p>
    </div>

  </div>

  <!-- Password strength script -->
  <script>
    const passwordInput = document.getElementById('password');
    const bars = [
      document.getElementById('bar1'),
      document.getElementById('bar2'),
      document.getElementById('bar3'),
      document.getElementById('bar4')
    ];
    const strengthLabel = document.getElementById('strengthLabel');

    passwordInput.addEventListener('input', () => {
      const val = passwordInput.value;
      let score = 0;

      if (val.length >= 8)           score++;
      if (/[A-Z]/.test(val))         score++;
      if (/[0-9]/.test(val))         score++;
      if (/[^A-Za-z0-9]/.test(val))  score++;

      const colors  = ['#e94560', '#f0a500', '#38ef7d', '#11998e'];
      const labels  = ['Weak', 'Fair', 'Good', 'Strong'];

      bars.forEach((bar, i) => {
        bar.style.background = i < score ? colors[score - 1] : 'rgba(255,255,255,0.12)';
      });

      strengthLabel.textContent = score > 0 ? labels[score - 1] : 'Password strength';
      strengthLabel.style.color = score > 0 ? colors[score - 1] : 'rgba(255,255,255,0.4)';
    });
  </script>

  <!-- Form Validation Script -->
  <script src="script/register_form.js"></script>

</body>
</html>
